# Steady user traffic (about 20 requests/s), so the canary analysis has real requests to judge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  labels: { app: traffic }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic }
  template:
    metadata:
      labels: { app: traffic }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args: ["while true; do curl -s -o /dev/null --max-time 2 http://demo-app.demo.svc/; sleep 0.05; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
