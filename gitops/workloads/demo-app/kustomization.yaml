apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rollout.yaml
  - analysis-template.yaml
  - service.yaml
  - traffic.yaml
  - servicemonitor.yaml
  - alerts.yaml
  - dashboard.yaml
patches:
