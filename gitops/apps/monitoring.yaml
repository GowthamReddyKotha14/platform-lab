# Prometheus + Grafana + Alertmanager. Sync wave 0: installed first, because the
# demo app uses its ServiceMonitor and PrometheusRule types.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 69.8.2
    helm:
      releaseName: kps
      valuesObject:
        fullnameOverride: kps
        # Pick up ServiceMonitors and rules from every namespace, not just this release's
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 2d
            resources:
              requests: { cpu: 100m, memory: 400Mi }
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 50Mi }
        grafana:
          adminPassword: platform-lab   # local demo cluster only
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
        # kind runs these control-plane parts in a way Prometheus can't scrape; avoid false "down" alerts
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the Prometheus CRDs are too large for client-side apply
