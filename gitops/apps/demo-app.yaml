# The workload. selfHeal: anything changed by hand in the cluster is put back to match Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/GowthamReddyKotha14/platform-lab.git
    targetRevision: main
    path: gitops/workloads/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # Rollout/ServiceMonitor types may not exist yet on first sync
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
